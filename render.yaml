services:
  - type: web
    name: edupath-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: FAST_MODEL_NAME
        value: groq/qwen/qwen3.8-27b
      - key: DEEP_MODEL_NAME
        value: groq/openai/gpt-oss-120b
